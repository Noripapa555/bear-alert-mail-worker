name: Read-only mailbox connection check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dedicated-mailbox
  cancel-in-progress: false
jobs:
  check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - env:
          BEAR_MAIL_PASSWORD: ${{ secrets.BEAR_MAIL_PASSWORD }}
          BEAR_MAIL_HOST: ${{ secrets.BEAR_MAIL_HOST }}
          BEAR_MAIL_ADDRESS: ${{ secrets.BEAR_MAIL_ADDRESS }}
        run: python mail_probe.py

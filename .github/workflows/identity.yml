name: Keyless Firebase connection check
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          project_id: ${{ vars.BEAR_FIREBASE_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_MAIL_SERVICE_ACCOUNT }}
      - run: python -m pip install -r requirements.txt --quiet
      - env:
          BEAR_FIREBASE_PROJECT: ${{ vars.BEAR_FIREBASE_PROJECT }}
        run: python mail_identity_probe.py

# TEMPLATE ONLY: not active in the private app repository.
# Install only in the approved standalone PUBLIC worker repository.
# Standard ubuntu-latest is free for public repositories. Do not use larger
# runners, paid services, caches or artifacts containing email/credentials.
name: Municipality mail receiver
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: dedicated-mailbox
  cancel-in-progress: false
jobs:
  receive:
    if: github.event.repository.private == false && vars.MAIL_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_MAIL_SERVICE_ACCOUNT }}
      - run: python -m pip install -r requirements.txt --quiet
      - name: Receive, save, remove processed mail, and dispatch
        env:
          BEAR_MAIL_PASSWORD: ${{ secrets.BEAR_MAIL_PASSWORD }}
          BEAR_MAIL_HOST: ${{ vars.BEAR_MAIL_HOST }}
          BEAR_MAIL_ADDRESS: ${{ vars.BEAR_MAIL_ADDRESS }}
          BEAR_FIREBASE_PROJECT: ${{ vars.BEAR_FIREBASE_PROJECT }}
        run: python mail_ingest.py --apply --publish
